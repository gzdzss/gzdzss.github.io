<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 虾身体 -->
  <ellipse cx="100" cy="100" rx="60" ry="40" fill="#FF6B6B" stroke="#FF4757" stroke-width="2"/>
  
  <!-- 虾尾巴 -->
  <path d="M40,100 Q20,90 40,80 Q60,70 40,60 Q20,50 40,40 Q60,30 40,20" 
        fill="none" stroke="#FF4757" stroke-width="3" stroke-linecap="round"/>
  
  <!-- 虾眼睛 -->
  <circle cx="130" cy="85" r="8" fill="white"/>
  <circle cx="130" cy="85" r="4" fill="black"/>
  <circle cx="130" cy="115" r="8" fill="white"/>
  <circle cx="130" cy="115" r="4" fill="black"/>
  
  <!-- 虾触须 -->
  <path d="M160,90 Q180,70 200,60" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  <path d="M160,110 Q180,130 200,140" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 虾腿 -->
  <path d="M80,120 Q70,140 60,130" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  <path d="M85,125 Q75,145 65,135" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  <path d="M80,80 Q70,60 60,70" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  <path d="M85,75 Q75,55 65,65" fill="none" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 微笑 -->
  <path d="M140,140 Q150,150 160,140" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 文字：野生虾 -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">野生虾</text>
</svg>